
logging:
    version: 1
    disable_existing_loggers: true
    formatters:
        standard:
            format: '%(asctime)s:%(name)s:%(levelname)s: %(message)s'
        colored:
            (): coloredlogs.ColoredFormatter
            format: '%(asctime)s:%(name)s:%(levelname)s: %(message)s'
            datefmt: '%Y-%m-%d %H:%M:%S.%f'
            field_styles:
                asctime:
                    color: green
                hostname:
                    bright: true
                    color: blue
                levelname:
                    #bold: true
                    bright: true
                    color: magenta
                name:
                    color: cyan
                programname:
                    color: cyan
                username:
                    color: yellow
        log_server:
            format: '%(asctime)s\n%(name)s\n%(levelname)s\n%(funcName)s (%(filename)s:%(lineno)d)\n%(message)s'
            datefmt: '%Y-%m-%d %H:%M:%S'
    handlers:
        console:
            level: DEBUG
            formatter: colored
            class: logging.StreamHandler
            stream: ext://sys.stdout
        file:
            level: DEBUG
            formatter: standard
            class: logging.FileHandler
            mode: 'a'
            filename: logs.log
        web_handler:
            level: INFO
            formatter: log_server
            host: eng-logtools.corp.alleninstitute.org
            port: 9000
            class: logging.handlers.SocketHandler
    loggers:
        '':
            level: DEBUG
            handlers:
            - console
            - file
            #- web_handler
devices:
    selector_port_map:
        class: builtins.dict
        kwds:
            air: 4
            chamber: 6
            waste: 3
            drain: 5
            PBS: 1
            diH20: 2
    config: 
      class: brainwasher.brainslosher_models.BrainSlosherConfig
      kwds:
        selector_port_map: selector_port_map
        drain_volume_buffer_ml: .5
        fill_volume_ml: 10 
    rxn_vessel:
        class: brainwasher.devices.vessels.ReactionVessel
        skip_kwds: [name]
        kwds:
            max_volume_ul: 50000
            name: reaction_vessel
    waste_vessel:
        factory: brainwasher.devices.vessels.WasteVessel
        kwds:
            max_volume_ul: 50000
            name: waste_vessel
    pump:
        class: runze_control.multichannel_syringe_pump.SY01B
        kwds:
            position_map: selector_port_map
            com_port: "COM4" 
            baudrate: 9600 
            position_count: 6
            syringe_volume_ul: 5000
    mixer:
        class: brainwasher.devices.pololu.pololu_tic_mixer.PololuTicMixer
        kwds:
            max_rpm:  500
            serial: "00477970"
    
# Full System:
    brainwasher:
        class: brainwasher.devices.instruments.brainslosher.BrainSlosher
        kwds:
            config: config
            pump: pump
            mixer: mixer
            rxn_vessel: rxn_vessel
            waste_vessel: waste_vessel
      
