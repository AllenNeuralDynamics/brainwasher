[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "brainwasher"
version = "0.3.0"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mixology[brainwasher] @ git+https://github.com/AllenNeuralDynamics/brainwasher.git@v1.0.0",
    "runze-control",
    "inpromptu",
    "igraph>=0.11.5",
    "device-spinner @ git+ssh://git@github.com/AllenNeuralDynamics/device-spinner.git@main",
    "runze-control @ git+https://github.com/AllenNeuralDynamics/runze-control.git@main",
    "inpromptu @ git+https://github.com/Poofjunior/inpromptu.git@main",
]

[project.scripts]
brainwasher = "brainwasher.scripts.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.9.9"
    ]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=10.0.0",
]


[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
