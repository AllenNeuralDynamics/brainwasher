logging:
    version: 1
    disable_existing_loggers: true
    formatters:
        standard:
            format: '%(asctime)s:%(name)s:%(levelname)s: %(message)s'
        colored:
            (): coloredlogs.ColoredFormatter
            format: '%(asctime)s:%(name)s:%(levelname)s: %(message)s'
            datefmt: '%Y-%m-%d %H:%M:%S.%f'
            field_styles:
                asctime:
                    color: green
                hostname:
                    bright: true
                    color: blue
                levelname:
                    #bold: true
                    bright: true
                    color: magenta
                name:
                    color: cyan
                programname:
                    color: cyan
                username:
                    color: yellow
        log_server:
            format: '%(asctime)s\n%(name)s\n%(levelname)s\n%(funcName)s (%(filename)s:%(lineno)d)\n%(message)s'
            datefmt: '%Y-%m-%d %H:%M:%S'
    handlers:
        console:
            level: DEBUG
            formatter: colored
            class: logging.StreamHandler
            stream: ext://sys.stdout
        file:
            level: DEBUG
            formatter: standard
            class: logging.FileHandler
            mode: 'a'
            filename: logs.log
        web_handler:
            level: INFO
            formatter: log_server
            host: eng-logtools.corp.alleninstitute.org
            port: 9000
            class: logging.handlers.SocketHandler
    loggers:
        '':
            level: DEBUG
            handlers:
            - console
            - file
            - web_handler
router_server_api:
  named_calls:
    start:
      obj_name: "seqflow"
      attr_name: "start_run"
    pause:
      obj_name: "seqflow"
      attr_name: "pause"
    get_job:
      obj_name: "seqflow"
      attr_name: "get_job"
    set_job:
      obj_name: "seqflow"
      attr_name: "set_job"
    get_config:
      obj_name: "seqflow"
      attr_name: "get_config"
  periodic_streams:
    get_progress:
      frequency_hz: 1
      obj_name: "seqflow"
      attr_name: "get_progress"
router_server_kwargs:
    rpc_port: 5555
    broadcast_port: 5556
devices:
  config: 
    class: seqflow.seqflow_config.SeqFlowConfig
    kwds:
      selector_port_map:
        incorporation_buffer: 1
        pbst: 2
        iodoacetamide_blocker: 3
        irm: 4
        usm: 5
        crm: 6
        fish_wash: 7
        strip: 8
        hyb_oligos_mix: 9
        dapi: 10
        bc_primer_mix: 11
        gene_primer_mix: 12
        hyb_oligos_mix_2: 13
        end: 14
        hyb_oligos_mix_3: 15
        hyb_oligos_mix_4: 16
      instrument_name: Simulated SeqFlow
  pump:
    class: mixology.devices.simulated_devices.peristaltic_pump.SimPeristalticPump
    kwds:
        name: "simPump"
        flow_rate_mlpm: 1.5
  selector:
    class: mixology.devices.simulated_devices.selector.SimSelector
    kwds:
        name: "simSelector"
        positions: 10
        position_map: selector_port_map
  rxn_vessel:
    class: mixology.devices.vessels.SlideContainer
    skip_kwds: [name]
    kwds:
        name: slide_container
        num_slides: 3
  # Full System:
  seqflow:
    class: seqflow.seqflow.SeqFlow
    kwds:
      config: config
      pump: pump
      selector: selector
      rxn_vessel: rxn_vessel
