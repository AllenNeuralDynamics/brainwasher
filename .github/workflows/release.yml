name: Release
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
  workflow_call:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mixology:
              - 'pyproject.toml'
              - 'setup.py'
              - 'src/**'
              - 'tests/**'
              - 'README.md'
            brainwasher:
              - 'instruments/brainwasher/**'
            brainslosher:
              - 'instruments/brainslosher/**'
            seqflow:
              - 'instruments/seqflow/**'

      - id: matrix
        shell: bash
        run: |
          packages=()
          if [[ "${{ steps.paths.outputs.mixology }}" == "true" ]]; then
            packages+=("{\"name\":\"mixology\",\"path\":\".\"}")
          fi
          if [[ "${{ steps.paths.outputs.brainwasher }}" == "true" ]]; then
            packages+=("{\"name\":\"brainwasher\",\"path\":\"instruments/brainwasher\"}")
          fi
          if [[ "${{ steps.paths.outputs.brainslosher }}" == "true" ]]; then
            packages+=("{\"name\":\"brainslosher\",\"path\":\"instruments/brainslosher\"}")
          fi
          if [[ "${{ steps.paths.outputs.seqflow }}" == "true" ]]; then
            packages+=("{\"name\":\"seqflow\",\"path\":\"instruments/seqflow\"}")
          fi

          if [[ ${#packages[@]} -eq 0 ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          joined=$(IFS=,; echo "${packages[*]}")
          echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

  release:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Read package version
        id: meta
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          version=$(python - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          PY
          )
          release_name="${{ matrix.name }}-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${release_name}" >> "$GITHUB_OUTPUT"

      - name: Check release name does not already exist
        uses: actions/github-script@v7
        env:
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
        with:
          script: |
            const releaseName = process.env.RELEASE_NAME;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            if (releases.some((release) => release.name === releaseName)) {
              core.setFailed(`Release ${releaseName} already exists.`);
            }

      - name: Build package artifacts
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          rm -rf dist
          uv build

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: ${{ matrix.path }}/dist/*
          fail_on_unmatched_files: true
